<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Daftar Akun | E-Kinerja</title>
    <meta property="og:image"
    content="https://ekinerja-pro.sneijderlino.workers.dev/assets/img/logo-apk.png" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="css/index.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body id="main-body">
    <style>
      .nav-hamburger {
        display: none;
        background: none;
        border: none;
        color: #fff;
        font-size: 1.3rem;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 8px;
      }
      .mobile-nav-menu {
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        background: rgba(15, 25, 41, 0.98);
        border-top: 1px solid rgba(15, 159, 255, 0.15);
      }
      .mobile-nav-menu.open { display: flex; }
      @media (max-width: 768px) {
        .nav-hamburger { display: block !important; margin-left: auto; }
        .nav-container { flex-wrap: wrap; }
        .nav-container > .nav-link { display: none !important; }
        .nav-container > .nav-link.active { display: flex !important; }
        .mobile-nav-menu { width: 100%; }
      }
    </style>

    <div id="app-shell" style="visibility: visible">
      <nav class="navbar animate__animated animate__fadeInDown">
        <div class="nav-container">
          <a href="/index.html" class="nav-link"
            ><i class="fas fa-home"></i> Beranda</a>
          <a href="masuk.html" class="nav-link"
            ><i class="fas fa-sign-in-alt"></i> Masuk</a>
          <a href="#" class="nav-link active"
            ><i class="fas fa-user-plus"></i> Daftar</a>
          <button class="nav-hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>
        <div class="mobile-nav-menu" id="mobileNavMenu">
          <a href="/index.html" class="nav-link"><i class="fas fa-home"></i> Beranda</a>
          <a href="masuk.html" class="nav-link"><i class="fas fa-sign-in-alt"></i> Masuk</a>
          <a href="#" class="nav-link active"><i class="fas fa-user-plus"></i> Daftar</a>
        </div>
      </nav>

      <div class="container">
        <div class="form-container" data-aos="fade-up">
          <h1
            style="
              text-align: center;
              margin-bottom: 30px;
              color: var(--primary);
            "
          >
            <i class="fas fa-user-plus" style="margin-right: 10px"></i>
            DAFTAR AKUN BARU
          </h1>

          <p
            style="
              text-align: center;
              color: #94a3b8;
              margin-bottom: 30px;
              font-size: 0.9rem;
            "
          >
            Buat akun untuk mulai menggunakan aplikasi E-Kinerja
          </p>

          <form id="registerForm" class="report-form">
            <div class="form-group">
              <label for="registerUsername">Username *</label>
              <input
                type="text"
                id="registerUsername"
                name="registerUsername"
                placeholder="Masukkan username Anda"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerEmail">Email *</label>
              <input
                type="email"
                id="registerEmail"
                name="registerEmail"
                placeholder="Masukkan alamat email Anda"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerPassword">Password *</label>
              <input
                type="password"
                id="registerPassword"
                name="registerPassword"
                placeholder="Buat password (minimal 6 karakter)"
                minlength="6"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerConfirmPassword">Konfirmasi Password *</label>
              <input
                type="password"
                id="registerConfirmPassword"
                name="registerConfirmPassword"
                placeholder="Konfirmasi password Anda"
                minlength="6"
                required
              />
            </div>

            <div class="form-actions">
              <button
                type="button"
                class="btn btn-secondary"
                onclick="location.href = '/index.html'"
              >
                <i class="fas fa-arrow-left"></i> Kembali
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-user-plus"></i> Daftar Sekarang
              </button>
            </div>
          </form>

          <div
            style="
              text-align: center;
              margin-top: 20px;
              color: #94a3b8;
              font-size: 0.9rem;
            "
          >
            Sudah punya akun?
            <a
              href="masuk.html"
              style="color: var(--primary); text-decoration: none"
              >Masuk di sini</a>
          </div>
      </div>

    <div id="loading-overlay">
      <div class="loading-spinner"></div>
      <p>Memuat aplikasi...</p>
    </div>

    <script>
      function toggleMobileMenu() {
        document.getElementById('mobileNavMenu').classList.toggle('open');
      }

      AOS.init({
        duration: 800,
        once: true,
      });

      document.addEventListener("DOMContentLoaded", function () {
        const currentUser = localStorage.getItem("ekin_session");
        if (currentUser) {
          window.location.href = "/index.html";
          return;
        }

        const form = document.getElementById("registerForm");
        form.addEventListener("submit", function (e) {
          e.preventDefault();

          const username = document.getElementById("registerUsername").value.trim();
          const email = document.getElementById("registerEmail").value.trim();
          const password = document.getElementById("registerPassword").value;
          const confirmPassword = document.getElementById("registerConfirmPassword").value;

          if (!username || !email || !password || !confirmPassword) {
            showToast("Semua field wajib diisi!");
            return;
          }

          if (password !== confirmPassword) {
            showToast("Password dan konfirmasi password tidak cocok!");
            return;
          }

          if (password.length < 6) {
            showToast("Password minimal 6 karakter!");
            return;
          }

          const users = JSON.parse(localStorage.getItem("ekin_users") || "[]");
          const exists = users.find(
            (u) => u.email.toLowerCase() === email.toLowerCase() || u.username.toLowerCase() === username.toLowerCase()
          );

          if (exists) {
            showToast("Email atau username sudah terdaftar!");
            return;
          }

          const newUser = {
            id: 'u_' + Date.now().toString(36),
            username: username,
            email: email.toLowerCase(),
            password: password,
            createdAt: new Date().toISOString(),
          };

          users.push(newUser);
          localStorage.setItem("ekin_users", JSON.stringify(users));

          showToast("Pendaftaran berhasil! Silakan masuk.");

          setTimeout(() => {
            window.location.href = "masuk.html";
          }, 2000);
        });
      });

      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => toast.classList.add("show"), 100);

        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
          }, 300);
        }, 3000);
      }
    </script>
  </body>
</html>
