name: 🚀 Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          CI: true

      - name: 🏗️ Build project
        run: npm run build
        env:
          CI: true
          NODE_ENV: production

      - name: ✅ Verify build output
        run: |
          echo "Checking build output..."
          test -f index.html || (echo "❌ index.html not found!" && exit 1)
          test -f service-worker.js || (echo "❌ service-worker.js not found!" && exit 1)
          test -f _redirects || (echo "⚠️  _redirects not found - creating default" && echo "/* /index.html 200" > _redirects)
          echo "✅ Build output verified"

      - name: 🌍 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ekinerja-pro
          directory: .
          productionBranch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "🌐 URL: https://ekinerja-pro.pages.dev"
          else
            echo "❌ Deployment failed!"
          fi

      - name: 💬 Comment PR with deployment URL
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = "${{ job.status }}" === "success" ? "✅" : "❌";
            const comment = `${status} **Deployment Status**: ${{ job.status }}\n\n📦 **Branch**: \`${{ github.head_ref }}\`\n🔗 **Preview**: https://ekinerja-pro.pages.dev\n\nBuild completed at: ${new Date().toISOString()}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 🔔 Slack notification (optional)
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*E-Kinerja Deployment* ${{ job.status }}\n*Branch*: ${{ github.ref_name }}\n*URL*: https://ekinerja-pro.pages.dev"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
